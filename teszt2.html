         :root {
            --bg-color: #f4f4f4;
            --header-footer-bg: #222;
            --accent-blue: #2b7fff;
            --correct-green: #4caf50;
            --wrong-red: #f44336;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-color); display: flex; flex-direction: column; min-height: 100vh; }

        /* Header */
        header { background-color: var(--header-footer-bg); color: white; padding: 15px 50px; display: flex; justify-content: flex-start; align-items: center; }
        nav { display: flex; align-items: center; gap: 20px; width: 100%; }
        nav a { color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; opacity: 0.8; }
        nav a.active { background: white; color: black; font-weight: bold; opacity: 1; }

        .page-section { display: none; flex-grow: 1; flex-direction: column; align-items: center; padding: 40px 20px; }
        .page-section.active { display: flex; }

        /* FOLYAMATJELZŐ SZÁMOKKAL */
        .progress-container { 
             width: 80%; 
             max-width: 800px; 
             background-color: #ddd; 
             height: 25px; 
             border-radius: 15px; 
             margin-bottom: 40px; 
             overflow: hidden;
             position: relative;
        }

        #progress-bar { 
             height: 100%; 
             width: 10%; 
             background-color: var(--accent-blue); 
             transition: width 0.5s ease; 
             display: flex;
             align-items: center;
             justify-content: center;
             color: white;
             font-weight: bold;
             font-size: 14px;
        }

        /* Kvíz kártya */
        .quiz-card { background: white; border: 8px solid #999; border-radius: 30px; padding: 40px; width: 90%; max-width: 600px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        
        .option { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; border: 4px solid transparent; transition: 0.2s; background: #eee; }
        .option img { width: 100%; height: 150px; object-fit: cover; display: block; }

        .feedback-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; display: none; z-index: 5; text-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; }

        /* Gombok */
        .buttons { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 12px 30px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .back-btn { background: var(--accent-blue); }
        .next-btn { background: #444; opacity: 0.4; cursor: not-allowed; }
        .next-btn.enabled { opacity: 1; cursor: pointer; background: #333; }

        footer { background-color: var(--header-footer-bg); color: white; padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; margin-top: auto; }

    </style>
</head>
<body>

    <header>
        <nav id="main-nav">
            <a href="n.html">Főoldal</a>
            <a href="filmek.html">Filmek</a>
            <a href="nevezetessegek.html">Nevezetességek</a>

                        Keresés

    <main id="cars" class="page-section active">
        <div class="progress-container">
            <div id="progress-bar">10 %</div>

        <div class="quiz-card">
            <h2 id="question-text">Betöltés...</h2>
            <div class="image-grid" id="options-container"></div>
            <div class="buttons">
                <button class="back-btn" onclick="prevQuestion()">Vissza</button>
                <button id="next-button" class="next-btn" onclick="nextQuestion()" disabled>Tovább</button>

        </div>

    <footer class="footer">

            <li><i class="icon-location"></i> Magyarország</li>
          </ul>
        </div>
         <div class="footer-section">
          <h3>Támogatók</h3>

            <li>TechNova Kft</li>

            <li>CodeFactory Solutions</li>

        </div>
          <div class="footer-section">

        </div>
       </div>

    <script>
        // 10 EGYEDI KÉRDÉS ÉS KÉPHELYEK
        const questions = [
            {
                q: "1. Melyik képen látható egy Lada?",
                options: [
                    { img: "kep1_1.jpg", correct: true },
                    { img: "kep1_2.jpg", correct: false },
                    { img: "kep1_3.jpg", correct: false },
                    { img: "kep1_4.jpg", correct: false }
                ]
            },
            {
                q: "2. Melyik egy Tesla?",
                options: [
                    { img: "kep2_1.jpg", correct: false },
                    { img: "kep2_2.jpg", correct: true },
                    { img: "kep2_3.jpg", correct: false },
                    { img: "kep2_4.jpg", correct: false }
                ]
            },
            {
                q: "3. Melyik autó német gyártmány?",
                options: [
                    { img: "kep3_1.jpg", correct: false },
                    { img: "kep3_2.jpg", correct: false },
                    { img: "kep3_3.jpg", correct: true },
                    { img: "kep3_4.jpg", correct: false }
                ]
            },
            {
                q: "4. Melyik egy terepjáró?",
                options: [
                    { img: "kep4_1.jpg", correct: true },
                    { img: "kep4_2.jpg", correct: false },
                    { img: "kep4_3.jpg", correct: false },
                    { img: "kep4_4.jpg", correct: false }
                ]
            },
            {
                q: "5. Melyik logó Ferrari?",
                options: [
                    { img: "kep5_1.jpg", correct: false },
                    { img: "kep5_2.jpg", correct: true },
                    { img: "kep5_3.jpg", correct: false },
                    { img: "kep5_4.jpg", correct: false }
                ]
            },
            {
                q: "6. Melyik egy japán autó?",
                options: [
                    { img: "kep6_1.jpg", correct: false },
                    { img: "kep6_2.jpg", correct: false },
                    { img: "kep6_3.jpg", correct: true },
                    { img: "kep6_4.jpg", correct: false }
                ]
            },
            {
                q: "7. Melyik látható filmekben?",
                options: [
                    { img: "kep7_1.jpg", correct: true },
                    { img: "kep7_2.jpg", correct: false },
                    { img: "kep7_3.jpg", correct: false },
                    { img: "kep7_4.jpg", correct: false }
                ]
            },
            {
                q: "8. Melyik egy luxusautó?",
                options: [
                    { img: "kep8_1.jpg", correct: false },
                    { img: "kep8_2.jpg", correct: true },
                    { img: "kep8_3.jpg", correct: false },
                    { img: "kep8_4.jpg", correct: false }
                ]
            },
            {
                q: "9. Melyik sportautó?",
                options: [
                    { img: "kep9_1.jpg", correct: true },
                    { img: "kep9_2.jpg", correct: false },
                    { img: "kep9_3.jpg", correct: false },
                    { img: "kep9_4.jpg", correct: false }
                ]
            },
            {
                q: "10. Melyik a Bogár?",
                options: [
                    { img: "kep10_1.jpg", correct: false },
                    { img: "kep10_2.jpg", correct: false },
                    { img: "kep10_3.jpg", correct: false },
                    { img: "kep10_4.jpg", correct: true }
                ]
            }
        ];

        let currentStep = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const nextBtn = document.getElementById('next-button');
            nextBtn.disabled = true;
            nextBtn.classList.remove('enabled');

            const qData = questions[currentStep];
            document.getElementById('question-text').innerText = qData.q;
            
            const percentage = (currentStep + 1) * 10;
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = percentage + "%";
            progressBar.innerText = percentage + " %";

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `
                    <img src="${opt.img}" alt="kép">
                    <div class="feedback-icon">${opt.correct ? '<span style="color:#4eff54">✔</span>' : '<span style="color:#ff3d3d">✘</span>'}</div>
                `;
                div.onclick = () => selectOption(div, opt.correct);
                container.appendChild(div);
            });
        }

        function selectOption(element, isCorrect) {
            if(answered) return;
            answered = true;

            const nextBtn = document.getElementById('next-button');
            nextBtn.disabled = false;
            nextBtn.classList.add('enabled');

            element.style.borderColor = isCorrect ? 'var(--correct-green)' : 'var(--wrong-red)';
            element.querySelector('.feedback-icon').style.display = 'block';

            if(!isCorrect) {
                const allOpts = document.querySelectorAll('.option');
                questions[currentStep].options.forEach((o, i) => {
                    if(o.correct) {
                        allOpts[i].style.borderColor = 'var(--correct-green)';
                        allOpts[i].querySelector('.feedback-icon').style.display = 'block';
                    }
                });
            }
        }

        function nextQuestion() {
            if(currentStep < questions.length - 1) {
                currentStep++;
                loadQuestion();
            } else {
                alert("Gratulálok! Elérted a 100%-ot!");
            }
        }

        function prevQuestion() {
            if(currentStep > 0) {
                currentStep--;
                loadQuestion();
            }
        }

        loadQuestion();
    </script>
