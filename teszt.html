<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes Kvíz</title>
    <style>
        :root {
            --primary: #3498db;
            --dark: #2c3e50;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .quiz-container {
            background-color: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 10px;
            background-color: var(--primary);
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s;
        }

        .hidden { display: none; }

        button {
            background-color: var(--dark);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }

        button:hover { background-color: #1a252f; }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
            margin: 5px 0;
        }

        .option-btn:hover { background: #e9ecef; }

        #feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .image-placeholder {
            width: 100%;
            height: 200px;
            background: #eee;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Kezdőoldal -->
        <div id="start-screen">
            <h1>Üdvözöllek a Filmes Kvízben!</h1>
            <p>Teszteld a tudásodat 10 izgalmas kérdésen keresztül a mozi világáról.</p>
            <button onclick="startQuiz()">Kezdés</button>
        </div>

        <!-- Kvíz felület -->
        <div id="quiz-screen" class="hidden">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="progress-text">0%</p>
            
            <div id="question-area">
                <div class="image-placeholder" id="image-container">
                    <!-- Itt jelenik meg a kép -->
                </div>
                <h3 id="question-text">Kérdés helye</h3>
                <div id="options-container"></div>
            </div>

            <div id="feedback"></div>
            <button id="submit-btn" onclick="checkAnswer()">Beküldés</button>
            <button id="next-btn" class="hidden" onclick="nextQuestion()">Tovább</button>
        </div>

        <!-- Eredmény oldal -->
        <div id="result-screen" class="hidden">
            <h2>Kész!</h2>
            <p id="final-score"></p>
            <button onclick="location.reload()">Vissza a főoldalra</button>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "Ki látható a képen?", a: ["Thranduil", "Batman", "Kevin McCallister", "Legolas"], c: 0, img: "https://vrt.be" },
            { q: "Melyik filmben szerepel Jack Sparrow?", a: ["Titanic", "A Karib-tenger kalózai", "Avatar", "Star Wars"], c: 1 },
            { q: "Ki rendezte a Ponyvaregényt?", a: ["Steven Spielberg", "Christopher Nolan", "Quentin Tarantino", "Martin Scorsese"], c: 2 },
            { q: "Hány Oscar-díjat nyert a Titanic?", a: ["5", "8", "11", "13"], c: 2 },
            { q: "Ki játszotta Vasembert?", a: ["Chris Evans", "Robert Downey Jr.", "Chris Hemsworth", "Tom Holland"], c: 1 },
            { q: "Melyik évben jelent meg az első Star Wars film?", a: ["1977", "1980", "1983", "1975"], c: 0 },
            { q: "Hogy hívják az Oroszlánkirály főhősét?", a: ["Mufasa", "Pumba", "Scar", "Simba"], c: 3 },
            { q: "Melyik városban játszódik a Batman filmek többsége?", a: ["Metropolis", "Gotham", "Central City", "New York"], c: 1 },
            { q: "Mi a neve a Gyűrűk Ura sötét urának?", a: ["Saruman", "Sauron", "Gollum", "Gandalf"], c: 1 },
            { q: "Melyik filmben hangzik el: 'I'll be back'?", a: ["Terminátor", "Rambo", "Die Hard", "Predator"], c: 0 }
        ];

        let currentIdx = 0;
        let score = 0;
        let selectedOption = null;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const data = quizData[currentIdx];
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('submit-btn').classList.remove('hidden');
            
            // Kép kezelése (ha van)
            const imgCont = document.getElementById('image-container');
            imgCont.innerHTML = data.img ? `<img src="${data.img}">` : "<span>Nincs kép</span>";

            const optionsCont = document.getElementById('options-container');
            optionsCont.innerHTML = "";
            
            data.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.className = "option-btn";
                btn.onclick = () => {
                    selectedOption = index;
                    document.querySelectorAll('.option-btn').forEach(b => b.style.borderColor = "#ddd");
                    btn.style.borderColor = "var(--primary)";
                };
                optionsCont.appendChild(btn);
            });

            updateProgress();
        }

        function checkAnswer() {
            if (selectedOption === null) return alert("Válassz egy választ!");
            
            const isCorrect = selectedOption === quizData[currentIdx].c;
            const fb = document.getElementById('feedback');
            
            if (isCorrect) {
                fb.innerText = "Helyes válasz! ✔️";
                fb.style.color = "green";
                score++;
            } else {
                fb.innerText = "Sajnos hibás! ❌";
                fb.style.color = "red";
            }

            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            selectedOption = null;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function updateProgress() {
            const percent = (currentIdx / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = percent + "%";
            document.getElementById('progress-text').innerText = Math.round(percent) + "%";
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `Eredményed: ${quizData.length}/${score}`;
        }
    </script>
</body>
</html>
