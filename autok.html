<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz oldal</title>
    <link rel="stylesheet" href="autok.css">
</head>

<body>

    <header>
        <nav id="main-nav">
            <a href="n.html">Főoldal</a>
            <a href="filmek.html">Filmek</a>
            <a href="nevezetessegek.html">Nevezetességek</a>
            <a href="autok.html" class="active">Autók</a>
            <form class="d-flex ms-auto search-form" role="search">
                <input class="form-control me-2 bg-white text-dark border-0" type="search" placeholder="Szöveg">
                <button class="btn bg-white text-dark border-0" type="submit">
                    Keresés
                </button>
            </form>
        </nav>
    </header>

    <main id="cars" class="page-section active">
        <div class="progress-container">
            <div id="progress-bar">10 %</div>
        </div>

        <div class="quiz-card">
            <h2 id="question-text">Betöltés...</h2>
            <div class="image-grid" id="options-container"></div>
            <div class="buttons">
                <button class="back-btn" onclick="prevQuestion()">Vissza</button>
                <button id="next-button" class="next-btn" onclick="nextQuestion()" disabled>Tovább</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h3>Elérhetőségek</h3>
                <ul class="contact-info">
                    <li><i class="icon-email"></i> <a href="mailto:mindenamikviz@gmail.com">mindenamikviz@gmail.com</a>
                    </li>
                    <li><i class="icon-phone"></i> +36 409 855</li>
                    <li><i class="icon-location"></i> Magyarország</li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Támogatók</h3>
                <ul class="partners">
                    <li>TechNova Kft</li>
                    <li>DigitalWave Studio</li>
                    <li>CodeFactory Solutions</li>
                    <li>BlueFilm Media</li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Hírlevél</h3>
                <button class="subscribe-btn">Feliratkozás</button>
                <p class="newsletter-text">Értesülj új kvízekről és friss tartalmakról</p>
            </div>
        </div>
    </footer>

    <script>
        const questions = [
            {
                q: "1. Melyik képen látható egy Lada?",
                options: [
                    { img: "kepek//porche1.jpg", correct: false },
                    { img: "kepek//polski1.jpg", correct: false },
                    { img: "kepek//trabant1.jpg", correct: false },
                    { img: "kepek//lada1.jpg", correct: true }
                ]
            },
            {
                q: "2. Melyik egy Tesla?",
                options: [
                    { img: "kepek//tesla2.avif", correct: true },
                    { img: "kepek//ferrari2.jpg", correct: false },
                    { img: "kepek//byd2.png", correct: false },
                    { img: "kepek//kei2.jpg", correct: false }
                ]
            },
            {
                q: "3. Melyik autó egy Porche?",
                options: [
                    { img: "kepek//kei2.jpg", correct: false },
                    { img: "kepek//byd3.jpg", correct: false },
                    { img: "kepek//porchetaycan.webp", correct: true },
                    { img: "kepek//lambo.jpg", correct: false }
                ]
            },
            {
                q: "4. Melyik gépjármű van 500 lóerő felett?",
                options: [
                    { img: "kepek//polo.webp", correct: false },
                    { img: "kepek//koenigsegg.jpg", correct: true },
                    { img: "kepek//toyota3.png", correct: false },
                    { img: "kepek//fiat.avif", correct: false }
                ]
            },
            {
                q: "5. Melyik kocsi egy Ferrari?",
                options: [
                    { img: "kepek//fiat.avif", correct: false },
                    { img: "kepek//corvette.jpg", correct: false },
                    { img: "kepek//repcsi.jpg", correct: false },
                    { img: "kepek//feri3.jpg", correct: true }
                ]
            },
            {
                q: "6. Melyik jármű egy Toyota?",
                options: [
                    { img: "kepek//toyota3.png", correct: true },
                    { img: "kepek//feri3.jpg", correct: false },
                    { img: "kepek//supra.avif", correct: true },
                    { img: "kepek//tesla2.avif", correct: false }
                ]
            },
            {
                q: "7. Melyik képen látható az Forma-1 jele?",
                options: [
                    { img: "kepek//f1.jpg", correct: true },
                    { img: "kepek//coca.png", correct: false },
                    { img: "kepek//red.jpg", correct: false },
                    { img: "kepek//nascar.avif", correct: false }
                ]
            },
            {
                q: "8. Melyik egy luxusautó?",
                options: [
                    { img: "kepek//lambo.jpg", correct: true },
                    { img: "kepek//bugi.jpg", correct: true },
                    { img: "kepek//polski1.jpg", correct: false },
                    { img: "kepek//rol.jpg", correct: true }
                ]
            },
            {
                q: "9. Melyik sportautó?",
                options: [
                    { img: "kepek//lambo.jpg", correct: true },
                    { img: "kepek//honda.jpg", correct: false },
                    { img: "kepek//pori.webp", correct: true },
                    { img: "kepek//fiat.avif", correct: false }
                ]
            },
            {
                q: "10. Melyik a Bogár?",
                options: [
                    { img: "kepek//bogar3.jpg", correct: true },
                    { img: "kepek//rally.jpg", correct: false },
                    { img: "kepek//bogar2.jpg", correct: true },
                    { img: "kepek//bogar.jpg", correct: true }
                ]
            }
        ];

        let currentStep = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const nextBtn = document.getElementById('next-button');
            nextBtn.disabled = true;
            nextBtn.classList.remove('enabled');

            const qData = questions[currentStep];
            document.getElementById('question-text').innerText = qData.q;

            const percentage = (currentStep + 1) * 10;
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = percentage + "%";
            progressBar.innerText = percentage + " %";

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `
                    <img src="${opt.img}" alt="kép">
                    <div class="feedback-icon">${opt.correct ? '<span style="color:#4eff54">✔</span>' : '<span style="color:#ff3d3d">✘</span>'}</div>
                `;
                div.onclick = () => selectOption(div, opt.correct);
                container.appendChild(div);
            });
        }

        function selectOption(element, isCorrect) {
            if (answered) return;
            answered = true;

            const nextBtn = document.getElementById('next-button');
            nextBtn.disabled = false;
            nextBtn.classList.add('enabled');

            element.style.borderColor = isCorrect ? 'var(--correct-green)' : 'var(--wrong-red)';
            element.querySelector('.feedback-icon').style.display = 'block';

            if (!isCorrect) {
                const allOpts = document.querySelectorAll('.option');
                questions[currentStep].options.forEach((o, i) => {
                    if (o.correct) {
                        allOpts[i].style.borderColor = 'var(--correct-green)';
                        allOpts[i].querySelector('.feedback-icon').style.display = 'block';
                    }
                });
            }
        }

        function nextQuestion() {
            if (currentStep < questions.length - 1) {
                currentStep++;
                loadQuestion();
            } else {
                alert("Gratulálok! Elérted a 100%-ot!");
            }
        }

        function prevQuestion() {
            if (currentStep > 0) {
                currentStep--;
                loadQuestion();
            }
        }

        loadQuestion();
    </script>
</body>

</html>
